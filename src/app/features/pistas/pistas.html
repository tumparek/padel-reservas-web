<div class="pistas">
  <div class="container py-4">
    <h1 class="pistas__title mb-4">Pistas</h1>

    <ul class="pistas__list list-unstyled row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-3">
      @for (court of courts(); track court.id) {
        <li class="pistas__item col">
          <article class="pistas__card card h-100">
            <div class="card-body d-flex flex-column">
              <h2 class="pistas__card-title card-title h5">{{ court.name }}</h2>

              <p class="pistas__card-type text-muted mb-1">
                <i class="bi bi-building"></i>
                {{ court.type === 'indoor' ? 'Interior' : 'Exterior' }}
              </p>
              <p class="pistas__card-schedule text-muted mb-1">
                <i class="bi bi-clock"></i>
                {{ court.openingTime }} – {{ court.closingTime }}
              </p>
              <p class="pistas__card-price mb-3">
                <i class="bi bi-cash-coin"></i>
                {{ court.pricePerHour }} €/hora
              </p>

              <a
                class="pistas__card-cta btn btn-primary mt-auto"
                routerLink="/reservar"
                [queryParams]="{ courtId: court.id }"
              >
                Reservar
              </a>
            </div>
          </article>
        </li>
      }
    </ul>
  </div>
</div>
