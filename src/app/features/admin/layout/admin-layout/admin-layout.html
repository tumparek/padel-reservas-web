<div class="admin-layout">
  <div class="admin-layout__sidebar" [class.admin-layout__sidebar--open]="sidebarOpen()">
    <app-admin-sidebar />
  </div>

  @if (sidebarOpen()) {
    <div class="admin-layout__backdrop" (click)="toggleSidebar()"></div>
  }

  <div class="admin-layout__main">
    <app-admin-topbar [title]="sectionTitle()" (toggleSidebar)="toggleSidebar()" />

    <div class="admin-layout__content">
      <router-outlet />
    </div>
  </div>
</div>
