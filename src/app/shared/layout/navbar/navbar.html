<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container-fluid">
    <span class="navbar-brand app-navbar__brand">
      <i class="bi bi-grid-1x2-fill"></i>
      <span>Padel Reservas</span>
    </span>

    <button
      type="button"
      class="navbar-toggler app-navbar__toggler"
      data-bs-toggle="collapse"
      data-bs-target="#appNavbarCollapse"
      aria-controls="appNavbarCollapse"
      aria-expanded="false"
      aria-label="Alternar navegación"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="appNavbarCollapse">
      <ul class="navbar-nav app-navbar__nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="app-navbar__link"
            routerLink="/"
            routerLinkActive="app-navbar__link--active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            <i class="bi bi-house-fill"></i>
            <span>Inicio</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="app-navbar__link" routerLink="/pistas" routerLinkActive="app-navbar__link--active">
            <i class="bi bi-grid-3x3-gap-fill"></i>
            <span>Pistas</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="app-navbar__link" routerLink="/reservar" routerLinkActive="app-navbar__link--active">
            <i class="bi bi-calendar-check"></i>
            <span>Reservar</span>
          </a>
        </li>
      </ul>

      <a class="app-navbar__admin-link" routerLink="/admin">
        <i class="bi bi-speedometer2"></i>
        <span>Panel admin</span>
      </a>

      @if (isAuthenticated()) {
        <div class="app-navbar__user">
          <span class="app-navbar__user-name">
            <i class="bi bi-person-circle"></i>
            <span>{{ currentUser()?.name }}</span>
          </span>
          <button type="button" class="app-navbar__logout" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i>
            <span>Cerrar sesión</span>
          </button>
        </div>
      } @else {
        <div class="app-navbar__auth">
          <a class="app-navbar__auth-link" routerLink="/login">Iniciar sesión</a>
          <a class="app-navbar__auth-link app-navbar__auth-link--cta" routerLink="/register">Registrarse</a>
        </div>
      }
    </div>
  </div>
</nav>
